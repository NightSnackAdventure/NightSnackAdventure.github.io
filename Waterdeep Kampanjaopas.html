<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waterdeep - Kampanjaopas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1326; --bg2:#0a0f1f; --panel:#15203f; --panel2:#1a274c;
    --ink:#f2e8cd; --ink-soft:#c7bf9f; --ink-faint:#8b86a0;
    --gold:#cda94f; --gold-soft:#e6d29a; --accent:#7d93cf;
    --line:rgba(205,169,79,.22); --line-2:rgba(205,169,79,.45);
    --shadow:rgba(0,0,0,.55); --ph:rgba(205,169,79,.10); --field:rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  #wd-scroll::-webkit-scrollbar { width: 10px; }
  #wd-scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; }
  #wd-scroll::-webkit-scrollbar-track { background: transparent; }
  @keyframes wdPulse { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }

  body {
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    background: radial-gradient(135% 90% at 50% -10%, var(--bg2), var(--bg) 62%);
    color: var(--ink); font-family: 'EB Garamond', Georgia, serif; font-size: 17px; line-height: 1.62;
  }

  .wd-header { position: relative; padding: 26px 24px 18px; text-align: center; border-bottom: 1px solid var(--line); flex: none; }
  .wd-themes { position: absolute; top: 18px; right: 22px; display: flex; gap: 6px; }
  .wd-theme-btn {
    display: flex; align-items: center; gap: 7px; padding: 5px 9px;
    background: transparent; border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
    color: var(--ink-faint); font-family: 'Cinzel', serif; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  }
  .wd-theme-btn.active { background: var(--field); border-color: var(--line-2); color: var(--ink); }
  .wd-theme-dot { position: relative; width: 14px; height: 14px; border-radius: 50%; overflow: hidden; display: inline-block; border: 1px solid var(--line); }
  .wd-theme-dot span { position: absolute; inset: 0; }
  .wd-theme-dot span:last-child { left: 50%; }

  .wd-kicker { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: .42em; font-size: 11px; color: var(--gold); text-transform: uppercase; padding-left: .42em; }
  .wd-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(34px, 6vw, 58px); letter-spacing: .18em; margin: 7px 0 0; color: var(--ink); padding-left: .18em; }
  .wd-divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 0 9px; }
  .wd-divider span:nth-child(1) { width: 64px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .wd-divider span:nth-child(2) { width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); display: block; }
  .wd-divider span:nth-child(3) { width: 64px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
  .wd-subtitle { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: .30em; font-size: 13px; color: var(--ink-soft); text-transform: uppercase; padding-left: .30em; }

  .wd-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--bg2); flex: none; }
  .wd-tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .wd-tab {
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .13em; text-transform: uppercase;
    padding: 14px 13px 12px; background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; gap: 7px;
  }
  .wd-tab.active { border-bottom-color: var(--gold); color: var(--gold); }
  .wd-tab-count { font-family: 'EB Garamond', serif; font-size: 12px; letter-spacing: 0; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; line-height: 1.5; }

  #wd-search {
    background: var(--field); border: 1px solid var(--line); border-radius: 3px; color: var(--ink);
    font-family: 'EB Garamond', serif; font-size: 14px; padding: 7px 11px; width: 200px; outline: none;
  }

  #wd-scroll { flex: 1; overflow-y: auto; padding: 28px 24px 64px; position: relative; }
  .wd-container { max-width: 1080px; margin: 0 auto; }
  .wd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 22px; }

  .wd-card {
    position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    box-shadow: 0 3px 16px var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  }
  .wd-card.highlight::before {
    content: ''; position: absolute; inset: 0; border: 2px solid var(--gold); border-radius: 5px;
    pointer-events: none; z-index: 5; animation: wdPulse 1.8s ease-out forwards;
  }
  .wd-card img { width: 100%; height: 200px; object-fit: contain; display: block; border-bottom: 1px solid var(--line); }
  .wd-card-noimg {
    height: 118px; background: repeating-linear-gradient(135deg, var(--ph) 0 11px, transparent 11px 22px);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  }
  .wd-card-noimg span {
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: .08em; color: var(--ink-faint);
    background: var(--bg2); padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px;
  }
  .wd-card-body { padding: 15px 16px 17px; display: flex; flex-direction: column; gap: 9px; }
  .wd-card-type { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .wd-card-title { font-family: 'Cinzel', serif; font-weight: 600; font-size: 19px; letter-spacing: .01em; color: var(--ink); margin: 0; line-height: 1.25; }
  .wd-card-subtitle { font-style: italic; color: var(--ink-soft); font-size: 15px; margin-top: -3px; }
  .wd-card-text { margin: 0; color: var(--ink-soft); font-size: 15.5px; text-wrap: pretty; }
  .wd-card-text p { margin: 0 0 0.6em; }
  .wd-card-text p:last-child { margin-bottom: 0; }
  .wd-links { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 3px; }
  .wd-link-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; background: transparent;
    border: 1px solid var(--line); border-radius: 3px; color: var(--gold-soft); font-family: 'EB Garamond', serif;
    font-size: 13px; cursor: pointer; letter-spacing: .01em;
  }
  .wd-link-btn:hover { background: var(--field); }

  .wd-empty { text-align: center; padding: 74px 20px; color: var(--ink-faint); }
  .wd-empty-mark { width: 10px; height: 10px; transform: rotate(45deg); background: var(--line-2); margin: 0 auto 16px; }
  .wd-empty-text { font-family: 'Cinzel', serif; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
  <header class="wd-header">
    <div class="wd-themes" id="wd-themes"></div>
    <div class="wd-kicker">Kampanjaopas</div>
    <h1 class="wd-title">WATERDEEP</h1>
    <div class="wd-divider"><span></span><span></span><span></span></div>
    <div class="wd-subtitle">Dragon Heist</div>
  </header>

  <nav class="wd-nav">
    <div class="wd-tabs" id="wd-tabs"></div>
    <input id="wd-search" placeholder="Etsi merkintöjä…" autocomplete="off">
  </nav>

  <div id="wd-scroll">
    <div class="wd-container" id="wd-content"></div>
  </div>

<script>
const THEMES = {
  loisto: { label: 'Loisto', vars: { '--bg':'#0d1326','--bg2':'#0a0f1f','--panel':'#15203f','--panel2':'#1a274c','--ink':'#f2e8cd','--ink-soft':'#c7bf9f','--ink-faint':'#8b86a0','--gold':'#cda94f','--gold-soft':'#e6d29a','--accent':'#7d93cf','--line':'rgba(205,169,79,.22)','--line-2':'rgba(205,169,79,.45)','--shadow':'rgba(0,0,0,.55)','--ph':'rgba(205,169,79,.10)','--field':'rgba(255,255,255,.05)' } },
  tome: { label: 'Tomu', vars: { '--bg':'#e2d4b2','--bg2':'#d8c8a2','--panel':'#f2e8ce','--panel2':'#ecdfc0','--ink':'#2a2114','--ink-soft':'#5b4c33','--ink-faint':'#8a7850','--gold':'#9a7726','--gold-soft':'#7a5e1f','--accent':'#7c2e2e','--line':'rgba(120,95,40,.30)','--line-2':'rgba(120,95,40,.55)','--shadow':'rgba(80,60,25,.20)','--ph':'rgba(120,95,40,.12)','--field':'rgba(120,95,40,.06)' } },
  lyhty: { label: 'Lyhty', vars: { '--bg':'#14110d','--bg2':'#0f0d0a','--panel':'#221d16','--panel2':'#2b251b','--ink':'#dccfb1','--ink-soft':'#a99c7e','--ink-faint':'#6f6552','--gold':'#c0964a','--gold-soft':'#d9b06a','--accent':'#b0613a','--line':'rgba(192,150,74,.20)','--line-2':'rgba(192,150,74,.45)','--shadow':'rgba(0,0,0,.6)','--ph':'rgba(192,150,74,.09)','--field':'rgba(255,255,255,.04)' } },
};

const state = { tabs: [], tab: null, query: '', highlightId: null };

function applyTheme(name) {
  const t = THEMES[name] || THEMES.loisto;
  const r = document.documentElement.style;
  Object.keys(t.vars).forEach(k => r.setProperty(k, t.vars[k]));
}

function setTheme(name) {
  applyTheme(name);
  try { localStorage.setItem('wd_theme', name); } catch (e) {}
  state.theme = name;
  renderThemes();
}

function renderThemes() {
  const el = document.getElementById('wd-themes');
  el.innerHTML = '';
  Object.keys(THEMES).forEach(key => {
    const th = THEMES[key];
    const btn = document.createElement('button');
    btn.className = 'wd-theme-btn' + (state.theme === key ? ' active' : '');
    btn.title = th.label;
    btn.onclick = () => setTheme(key);
    btn.innerHTML = `<span class="wd-theme-dot"><span style="background:${th.vars['--bg']}"></span><span style="background:${th.vars['--gold']}"></span></span><span>${th.label}</span>`;
    el.appendChild(btn);
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function setTab(key) {
  state.tab = key;
  state.query = '';
  state.highlightId = null;
  document.getElementById('wd-search').value = '';
  renderTabs();
  renderContent();
}

function jumpTo(tab, id) {
  state.tab = tab;
  state.query = '';
  state.highlightId = id;
  document.getElementById('wd-search').value = '';
  renderTabs();
  renderContent();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const el = document.getElementById('wd-' + id);
    const sc = document.getElementById('wd-scroll');
    if (el && sc) {
      const r1 = el.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      sc.scrollTo({ top: sc.scrollTop + (r1.top - r2.top) - 28, behavior: 'smooth' });
    }
  }));
  setTimeout(() => { state.highlightId = null; renderContent(); }, 1800);
}

function renderTabs() {
  const el = document.getElementById('wd-tabs');
  el.innerHTML = '';
  state.tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'wd-tab' + (t.key === state.tab ? ' active' : '');
    btn.onclick = () => setTab(t.key);
    btn.innerHTML = `<span>${escapeHtml(t.label)}</span><span class="wd-tab-count">${t.entries.length}</span>`;
    el.appendChild(btn);
  });
}

function lookupTitle(tab, id) {
  const t = state.tabs.find(x => x.key === tab);
  const e = t && t.entries.find(x => x.id === id);
  return e ? e.title : id;
}

function renderContent() {
  const container = document.getElementById('wd-content');
  const tab = state.tabs.find(t => t.key === state.tab);
  if (!tab) { container.innerHTML = ''; return; }

  const q = state.query.trim().toLowerCase();
  let items = tab.entries.slice();
  if (q) {
    items = items.filter(e =>
      (e.title || '').toLowerCase().includes(q) ||
      (e.body || '').toLowerCase().includes(q) ||
      (e.subtitle || '').toLowerCase().includes(q));
  }

  if (items.length === 0) {
    container.innerHTML = `
      <div class="wd-empty">
        <div class="wd-empty-mark"></div>
        <div class="wd-empty-text">${q ? 'Ei osumia haulle' : 'Ei merkintöjä'}</div>
      </div>`;
    return;
  }

  const cards = items.map(e => {
    const highlight = state.highlightId === e.id;
    const paragraphs = (e.body || '').split(/\n{2,}/).filter(Boolean)
      .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`).join('');
    const links = (e.links || []).map(l =>
      `<button class="wd-link-btn" data-tab="${l.tab}" data-id="${l.id}"><span>↦</span>${escapeHtml(lookupTitle(l.tab, l.id))}</button>`
    ).join('');

    return `
      <article id="wd-${e.id}" class="wd-card${highlight ? ' highlight' : ''}">
        ${e.image
          ? `<img src="${escapeHtml(e.image)}" alt="">`
          : `<div class="wd-card-noimg"><span>// kuva</span></div>`}
        <div class="wd-card-body">
          ${e.type ? `<div class="wd-card-type">${escapeHtml(e.type)}</div>` : ''}
          <h3 class="wd-card-title">${escapeHtml(e.title)}</h3>
          ${e.subtitle ? `<div class="wd-card-subtitle">${escapeHtml(e.subtitle)}</div>` : ''}
          <div class="wd-card-text">${paragraphs}</div>
          ${links ? `<div class="wd-links">${links}</div>` : ''}
        </div>
      </article>`;
  }).join('');

  container.innerHTML = `<div class="wd-grid">${cards}</div>`;
  container.querySelectorAll('.wd-link-btn').forEach(btn => {
    btn.addEventListener('click', () => jumpTo(btn.dataset.tab, btn.dataset.id));
  });
}

document.getElementById('wd-search').addEventListener('input', (ev) => {
  state.query = ev.target.value;
  renderContent();
});

fetch('kampanjaopas/data.json')
  .then(res => res.json())
  .then(data => {
    state.tabs = data.tabs || [];
    state.tab = state.tabs.length ? state.tabs[0].key : null;

    let savedTheme;
    try { savedTheme = localStorage.getItem('wd_theme'); } catch (e) {}
    state.theme = (savedTheme && THEMES[savedTheme]) ? savedTheme : 'lyhty';
    applyTheme(state.theme);

    renderThemes();
    renderTabs();
    renderContent();
  })
  .catch(err => {
    document.getElementById('wd-content').innerHTML =
      '<p style="text-align:center;padding-top:2rem;">Could not load campaign data.</p>';
    console.error(err);
  });
</script>
</body>
</html>
