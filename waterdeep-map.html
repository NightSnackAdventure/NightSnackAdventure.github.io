<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterdeep - Interactive Map</title>
    <link rel="stylesheet" href="waterdeep-theme.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
        #map-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 20px 24px; }

        #map {
            flex: 1;
            min-height: 0;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #0b0b0b;
            box-shadow: 0 8px 32px var(--shadow);
        }

        .map-hint {
            text-align: center;
            color: var(--ink-faint);
            font-size: 0.9rem;
            margin-top: 0.9rem;
            font-style: italic;
            flex: none;
        }

        /* Leaflet theme overrides */
        .leaflet-container {
            background: #0b0b0b;
            border-radius: 8px;
            font-family: 'EB Garamond', serif;
        }

        .leaflet-popup-content-wrapper {
            background: var(--panel);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 8px 24px var(--shadow);
        }

        .leaflet-popup-content {
            font-family: 'EB Garamond', serif;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0.9rem 1rem;
        }

        .leaflet-popup-content strong {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-weight: 600;
        }

        .leaflet-popup-tip {
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .leaflet-control-zoom a {
            background: var(--panel);
            color: var(--gold);
            border-color: var(--line) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--field);
            color: var(--ink);
        }

        .leaflet-control-attribution {
            background: rgba(0, 0, 0, 0.4) !important;
            color: var(--ink-faint) !important;
        }

        .leaflet-control-attribution a {
            color: var(--gold) !important;
        }
    </style>
</head>
<body>
    <header class="wd-header">
        <div class="wd-pages">
            <a class="wd-page-link" href="waterdeep-kampanjaopas.html">Kampanjaopas</a>
            <a class="wd-page-link active" href="waterdeep-map.html">Kartta</a>
        </div>
        <div class="wd-themes" id="wd-themes"></div>
        <div class="wd-kicker">Kartta</div>
        <h1 class="wd-title">WATERDEEP</h1>
        <div class="wd-divider"><span></span><span></span><span></span></div>
        <div class="wd-subtitle">The City of Splendors</div>
    </header>

    <div id="map-wrap">
        <div id="map"></div>
        <p class="map-hint">Drag to pan, scroll or pinch to zoom, click a pin for details.</p>
    </div>

    <script src="waterdeep-theme.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let currentTheme = wdLoadTheme();
        function setTheme(name) {
            wdApplyTheme(name);
            try { localStorage.setItem('wd_theme', name); } catch (e) {}
            currentTheme = name;
            wdRenderThemeSwitcher('wd-themes', currentTheme, setTheme);
        }
        wdRenderThemeSwitcher('wd-themes', currentTheme, setTheme);

        const MARKERS_URL = 'maps/waterdeep/map-10.01-waterdeep.jpg.markers.json';
        const IMAGE_URL = 'maps/waterdeep/map-10.01-waterdeep.jpg';

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        fetch(MARKERS_URL)
            .then(res => res.json())
            .then(initMap)
            .catch(err => {
                document.getElementById('map').innerHTML =
                    '<p style="color:var(--ink);text-align:center;padding-top:2rem;">Could not load the map data.</p>';
                console.error(err);
            });

        function initMap(data) {
            const w = data.size.w;
            const h = data.size.h;
            const bounds = [[0, 0], [h, w]];

            const map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -6,
                maxZoom: 4,
                zoomSnap: 0.25,
                attributionControl: false
            });

            L.imageOverlay(IMAGE_URL, bounds).addTo(map);
            map.setMaxBounds([[-h * 0.25, -w * 0.25], [h * 1.25, w * 1.25]]);
            map.fitBounds(bounds);

            const layerVisible = {};
            (data.layers || []).forEach(l => { layerVisible[l.id] = l.visible !== false; });

            (data.markers || []).forEach(m => {
                if (typeof m.x !== 'number' || typeof m.y !== 'number') return;
                if (m.layer && layerVisible[m.layer] === false) return;

                const lat = h * (1 - m.y);
                const lng = w * m.x;
                const color = m.iconColor || '#cda94f';

                const marker = L.circleMarker([lat, lng], {
                    radius: 9,
                    color: '#0d0d0d',
                    weight: 2,
                    fillColor: color,
                    fillOpacity: 0.9
                }).addTo(map);

                const tooltip = (m.tooltip || '').trim();
                if (tooltip) {
                    const lines = tooltip.split('\n').map(escapeHtml);
                    const title = lines[0];
                    const rest = lines.slice(1).join('<br>');
                    marker.bindPopup(
                        `<strong>${title}</strong>${rest ? '<br>' + rest : ''}`
                    );
                }
            });
        }
    </script>
</body>
</html>
