<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterdeep - Interactive Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Spectral:wght@300;400;600;700&family=Cinzel:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <style>
       @import "styles.css";

        .map-page {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem 4rem;
        }

        .map-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--teal);
            position: relative;
        }

        .map-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: var(--teal-bright);
            box-shadow: 0 0 20px var(--teal-bright);
        }

        .map-header h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.2rem, 6vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--teal-bright), var(--teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.05em;
        }

        .map-header p {
            font-family: 'Libre Baskerville', serif;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 0.5rem;
            text-indent: 0;
            font-size: 1.05rem;
        }

        #map {
            width: 100%;
            height: 78vh;
            min-height: 480px;
            border-radius: 8px;
            border: 1px solid var(--teal-dark);
            background: #0b0b0b;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .map-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 1rem;
            font-style: italic;
        }

        /* Leaflet theme overrides */
        .leaflet-container {
            background: #0b0b0b;
            border-radius: 8px;
            font-family: 'Spectral', serif;
        }

        .leaflet-popup-content-wrapper {
            background: var(--bg-medium);
            color: var(--text-light);
            border: 1px solid var(--teal);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .leaflet-popup-content {
            font-family: 'Spectral', serif;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0.9rem 1rem;
        }

        .leaflet-popup-content strong {
            font-family: 'Cinzel', serif;
            color: var(--teal-bright);
            font-weight: 600;
        }

        .leaflet-popup-tip {
            background: var(--bg-medium);
            border: 1px solid var(--teal);
        }

        .leaflet-control-zoom a {
            background: var(--bg-medium);
            color: var(--teal-bright);
            border-color: var(--teal-dark) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--teal-dark);
            color: var(--text-light);
        }

        .leaflet-control-attribution {
            background: rgba(26, 26, 26, 0.7) !important;
            color: var(--text-muted) !important;
        }

        .leaflet-control-attribution a {
            color: var(--teal-bright) !important;
        }
    </style>
</head>
<body>
    <div class="map-page">
        <header class="map-header">
            <h1>Waterdeep</h1>
            <p>The City of Splendors</p>
        </header>

        <div id="map"></div>
        <p class="map-hint">Drag to pan, scroll or pinch to zoom, click a pin for details.</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const MARKERS_URL = 'maps/waterdeep/map-10.01-waterdeep.jpg.markers.json';
        const IMAGE_URL = 'maps/waterdeep/map-10.01-waterdeep.jpg';

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        fetch(MARKERS_URL)
            .then(res => res.json())
            .then(initMap)
            .catch(err => {
                document.getElementById('map').innerHTML =
                    '<p style="color:#e2e8f0;text-align:center;padding-top:2rem;">Could not load the map data.</p>';
                console.error(err);
            });

        function initMap(data) {
            const w = data.size.w;
            const h = data.size.h;
            const bounds = [[0, 0], [h, w]];

            const map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -6,
                maxZoom: 4,
                zoomSnap: 0.25,
                attributionControl: false
            });

            L.imageOverlay(IMAGE_URL, bounds).addTo(map);
            map.setMaxBounds([[-h * 0.25, -w * 0.25], [h * 1.25, w * 1.25]]);
            map.fitBounds(bounds);

            const layerVisible = {};
            (data.layers || []).forEach(l => { layerVisible[l.id] = l.visible !== false; });

            (data.markers || []).forEach(m => {
                if (typeof m.x !== 'number' || typeof m.y !== 'number') return;
                if (m.layer && layerVisible[m.layer] === false) return;

                const lat = h * (1 - m.y);
                const lng = w * m.x;
                const color = m.iconColor || '#14b8a6';

                const marker = L.circleMarker([lat, lng], {
                    radius: 9,
                    color: '#1a1a1a',
                    weight: 2,
                    fillColor: color,
                    fillOpacity: 0.9
                }).addTo(map);

                const tooltip = (m.tooltip || '').trim();
                if (tooltip) {
                    const lines = tooltip.split('\n').map(escapeHtml);
                    const title = lines[0];
                    const rest = lines.slice(1).join('<br>');
                    marker.bindPopup(
                        `<strong>${title}</strong>${rest ? '<br>' + rest : ''}`
                    );
                }
            });
        }
    </script>
</body>
</html>
