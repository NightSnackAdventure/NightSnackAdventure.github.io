<!doctype html><html><body style="margin:0;display:grid;gap:4px;background:#ddd">
<!-- Dev contact sheet. sheet.html#42 = 32 flowers from seed 42; sheet.html#bush42 = 8 bushes. -->
<script type="module">
import { renderBloom, DNA_LEN, CDNA_LEN } from '/src/bloom.ts';
import { renderBush, BDNA_LEN } from '/src/bush.ts';
import { PALETTES } from '/src/palettes.ts';
import { mulberry32, randomGenes } from '/src/rng.ts';
const bush = location.hash.includes('bush');
const rng = mulberry32(Number(location.hash.replace(/\D/g, '')) || 7);
document.body.style.gridTemplateColumns = `repeat(${bush ? 4 : 8}, 1fr)`;
for (let i = 0; i < (bush ? 8 : 32); i++) {
  const pal = PALETTES[Math.floor(rng() * PALETTES.length)];
  const p = { lush: rng(), open: rng(), shape: rng(), curl: rng() };
  const s = { dna: randomGenes(DNA_LEN, rng), cdna: randomGenes(CDNA_LEN, rng), bdna: randomGenes(BDNA_LEN, rng) };
  const d = document.createElement('div');
  d.style.background = pal.bg;
  d.innerHTML = bush
    ? renderBush(s, p, { density: rng(), mirror: i % 2 === 0 }, pal)
    : renderBloom(s.dna, s.cdna, p, pal);
  document.body.append(d);
}
</script></body></html>
